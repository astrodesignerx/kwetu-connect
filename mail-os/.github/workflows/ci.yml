name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest

    services:
      # The integration tests run against real Postgres, not an in-memory provider:
      # the schema uses a stored generated tsvector column, jsonb and GIN indexes,
      # which only the real engine can create. Each test class creates and drops its
      # own clientcomms_test_<guid> database against this instance.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: 5432
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Kompanion.slnx

      - name: Build
        run: dotnet build Kompanion.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test apps/api.tests/Kompanion.Api.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=api-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults/
          if-no-files-found: ignore

  web:
    name: Web typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: pnpm install --frozen-lockfile

      # Fail on new high-severity advisories rather than letting them
      # sit unnoticed in a log.
      - name: pnpm audit
        run: pnpm audit --audit-level high

      - name: NuGet vulnerable packages
        run: |
          dotnet restore Kompanion.slnx
          # `list package --vulnerable` always exits 0, so grep the output instead.
          output=$(dotnet list Kompanion.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi
