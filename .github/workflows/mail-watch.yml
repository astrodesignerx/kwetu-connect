name: Check staff mail
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mail-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask the app to check connected mailboxes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://kwetuconnectads.co.ke' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          curl --fail --silent --show-error --max-time 58 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/mail-watch" > /dev/null
